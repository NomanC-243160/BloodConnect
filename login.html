<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>BloodConnect | Login</title>

    <script src="https://cdn.tailwindcss.com"></script>

    <link rel="stylesheet" href="style.css">

</head>


<body class="bg-gray-50 min-h-screen">


    <!-- Navbar -->

    <nav class="bg-white shadow-sm">

        <div class="max-w-7xl mx-auto px-6 py-4">

            <a href="index.html"
               class="flex items-center gap-2 w-fit">

                <span class="text-3xl">
                    🩸
                </span>

                <span class="text-2xl font-bold text-red-600">
                    BloodConnect
                </span>

            </a>

        </div>

    </nav>



    <!-- Login -->

    <main class="min-h-[calc(100vh-73px)]
                flex items-center justify-center px-6">


        <div class="w-full max-w-md">


            <div class="text-center mb-8">

                <div class="text-5xl">
                    🩸
                </div>

                <h1 class="text-3xl font-bold mt-4">
                    Welcome Back
                </h1>

                <p class="text-gray-500 mt-2">
                    Login to your BloodConnect account.
                </p>

            </div>



            <form id="loginForm"
                  class="bg-white p-8 rounded-2xl shadow-lg">


                <label class="block font-semibold mb-2">
                    Email
                </label>

                <input
                    type="email"
                    id="loginEmail"
                    placeholder="Enter your email"
                    class="input-field mb-5"
                    required>



                <label class="block font-semibold mb-2">
                    Password
                </label>

                <input
                    type="password"
                    id="loginPassword"
                    placeholder="Enter your password"
                    class="input-field mb-6"
                    required>



                <button
                    type="submit"
                    class="w-full bg-red-600 text-white
                           py-3 rounded-lg font-bold
                           hover:bg-red-700 transition">

                    Login

                </button>


                <p id="loginMessage"
                   class="text-center mt-4 text-sm">
                </p>


            </form>



            <p class="text-center text-gray-600 mt-6">

                Don't have an account?

                <a href="register.html"
                   class="text-red-600 font-bold">

                    Create Account

                </a>

            </p>

        </div>

    </main>


    <script src="auth.js"></script>

</body>

</html>
